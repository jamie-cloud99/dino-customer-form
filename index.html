<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🦕客服滿意度調查表</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="./src/main.js" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="trail" id="trail" aria-hidden="true">
      <span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span>
    </div>

    <header>
      <div class="eyebrow">DINO DESSERT SHOP · 龍龍甜點舖</div>
      <h1>小咚服務滿意度調查表</h1>
      <div class="sub">🦕出品・僅接受🦖本人填寫，評鑑對象為🦕・填完不用蓋章，誠實最重要</div>
    </header>

    <form id="form">
      <section class="card" data-num="01">
        <h2>填表人資料</h2>
        <p class="hint">請如實填寫，這關係到後續是否有宵夜加碼。</p>
        <div class="meta-row">
          <label class="name-field">填表人暱稱
            <input type="text" id="name" placeholder="🦖">
          </label>
          <label class="date-field">填寫日期
            <input type="date" id="filledDate">
          </label>
        </div>
      </section>

      <section class="card" data-num="02">
        <h2>服務評分</h2>
        <p class="hint">請給予 1〜5 隻🦕評價，誠實作答，不列入年終考核（大概）。</p>
        <div id="ratings"></div>
      </section>

      <section class="card" data-num="03">
        <h2>開放式回饋</h2>
        <p class="hint">想說什麼都可以，我會洗耳恭聽。</p>

        <label class="qlabel">本期印象最深刻的一件事</label>
        <textarea id="q1" placeholder="寫下讓妳印象最深的瞬間..."></textarea>

        <label class="qlabel">覺得加分、心動或溫暖感動的時刻</label>
        <textarea id="q2" placeholder="哪個瞬間讓妳覺得心動或被暖到了..."></textarea>

        <div class="complaint">
          <label class="qlabel">🦖客訴專區（可認真可吐槽）</label>
          <textarea id="q3" placeholder="這裡盡量發揮..."></textarea>
        </div>

        <label class="qlabel">對下期的期待清單</label>
        <textarea id="q4" placeholder="希望下次可以..."></textarea>

        <label class="qlabel">其他想說的話</label>
        <textarea id="q5" placeholder="還有什麼想補充的..."></textarea>
      </section>

      <section class="card" data-num="04">
        <h2>總體評價</h2>
        <p class="hint">送出後會自動生成客服滿意度總評，並附上簽署欄。</p>
        <div class="gauge-wrap">
          <div class="gauge-track">
            <div class="gauge-dino" id="gaugeDino">🦕</div>
            <div class="gauge-fill" id="gaugeFill"></div>
          </div>
          <div class="gauge-caption" id="gaugeCaption">請先完成上方評分</div>
        </div>
      </section>

      <button type="submit" class="submit-btn">送出評鑑報告 🦖</button>
    </form>

    <div class="result" id="result">
      <section class="card" id="reportCard" data-num="✓">
        <div class="tag" id="resultTag">滿意度總評</div>
        <div class="big-score" id="resultScore">0.0</div>
        <div class="echo" id="resultEcho"></div>
        <div class="sign-row">
          <div>
            <div class="sign-line">🦖 簽名</div>
          </div>
          <div class="sign-gap"></div>
          <div>
            <div class="sign-line">🦕 已閱並會改進</div>
          </div>
        </div>
      </section>

      <div class="share-row">
        <button type="button" class="share-btn" id="copyBtn">📋 複製報告文字</button>
        <a class="share-btn disabled" id="imgLink" href="#" download="dino-service-report.png" aria-disabled="true">🖼️ 圖片準備中</a>
      </div>
      <div class="share-status" id="shareStatus"></div>
    </div>

    <footer>本表單僅供🦕🦖二人使用・所有評分均具有法律上的可愛效力</footer>
  </div>
</body>
</html>
